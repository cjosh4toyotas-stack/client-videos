<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Client Videos — Josh at McGrath Toyota</title>
<style>
  :root{--red:#EB0A1E;--charcoal:#1A1A1A;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#111214;
    color:#F4F4F4;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    max-width:420px;
    text-align:center;
  }
  .mark{font-weight:bold;letter-spacing:2px;font-size:14px;margin-bottom:18px;}
  .mark span{color:var(--red);}
  h1{font-size:26px;margin-bottom:10px;}
  p{color:#9A9CA1;font-size:15px;line-height:1.6;margin-bottom:22px;}
  .actions{display:flex;gap:10px;}
  a{
    flex:1;
    text-decoration:none;
    padding:13px;
    border-radius:8px;
    font-size:15px;
    font-weight:bold;
    color:#fff;
  }
  .call{background:var(--red);}
  .text{background:#2A2B2E;border:1px solid #3A3B3E;}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">McGRATH <span>TOYOTA</span></div>
    <h1>Personal videos from Josh</h1>
    <p>This page hosts short vehicle videos I record for my customers. If your link didn't open a video, call or text me and I'll resend it.</p>
    <div class="actions">
      <a class="call" href="tel:3196311461">Call Josh</a>
      <a class="text" href="sms:3196311461">Text Josh</a>
    </div>
  </div>
</body>
</html>
