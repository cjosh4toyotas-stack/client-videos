  /* words and links hidden — video only */
  header{
    padding:14px 20px;
    border-bottom:1px solid #2A2B2E;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mark{
    font-weight:bold;
    letter-spacing:2px;
    font-size:14px;
  }
  .mark span{color:var(--red);}
  main{
    width:100%;
    max-width:1040px;
    margin:0 auto;
    padding:16px;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .eyebrow{
    color:var(--red);
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    font-weight:bold;
  }
  h1{
    font-size:34px;
    line-height:1.1;
    margin:6px 0 4px;
  }
  .vtitle{
    color:var(--muted);
    font-size:16px;
    margin-bottom:18px;
  }
  .frame{
    width:100%;
    background:#000;
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(70,200,255,.45);
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 30px 80px rgba(0,0,0,.7),0 0 40px rgba(20,150,255,.25);
    position:relative;
  }
  .wm{
    position:absolute;
    top:10px;
    right:12px;
    z-index:2;
    pointer-events:none;
    text-align:right;
    font-size:12px;
    line-height:1.45;
    color:rgba(255,255,255,0.92);
    text-shadow:0 1px 3px rgba(0,0,0,0.9);
    background:rgba(0,0,0,0.35);
    padding:4px 8px;
    border-radius:5px;
  }
  .wm strong{letter-spacing:0.3px;}
  video{
    display:block;
    width:100%;
    max-height:66vh;
    aspect-ratio:16/9;
    background:#000;
  }
  .after{
    margin-top:22px;
    background:var(--card);
    border:1px solid #2A2B2E;
    border-radius:10px;
    padding:18px;
  }
  .after p{
    color:var(--text);
    font-size:15px;
    margin-bottom:14px;
  }
  .actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .btn{
    flex:1;
    min-width:130px;
    text-align:center;
    text-decoration:none;
    padding:13px 16px;
    border-radius:8px;
    font-size:15px;
    font-weight:bold;
  }
  .btn.call{background:var(--red);color:#fff;}
  .btn.text{background:#2A2B2E;color:#fff;border:1px solid #3A3B3E;}
  footer{
    padding:16px 20px 26px;
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    line-height:1.6;
  }
  /* words and links hidden — video only */
  header,footer{display:none;}
  main{flex-direction:column;justify-content:center;gap:0;}
  .intro{width:100%;text-align:center;margin-bottom:16px;}
  .eyebrow{font-family:"Orbitron",Arial,sans-serif;color:#35d6ff;font-size:11px;letter-spacing:.5em;text-transform:uppercase;font-weight:500;text-shadow:0 0 12px rgba(53,214,255,.6);}
  h1{font-family:"Orbitron",Arial,sans-serif;font-size:clamp(28px,4.5vw,52px);font-weight:700;letter-spacing:.06em;margin:8px 0 6px;color:#f6fdff;text-shadow:0 0 14px rgba(190,240,255,.45),0 0 40px rgba(60,190,255,.35);}
  .vtitle{font-family:"Exo 2",Arial,sans-serif;color:#bfe6f3;font-size:clamp(14px,1.6vw,18px);letter-spacing:.12em;text-transform:uppercase;margin-bottom:0;}
  .dl{margin-top:16px;width:100%;padding:14px 18px;border-radius:8px;font-family:"Orbitron",Arial,sans-serif;font-size:12px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:#d9f7ff;background:rgba(4,30,52,.72);border:1.5px solid #35d6ff;box-shadow:0 0 14px rgba(53,214,255,.35),inset 0 0 14px rgba(53,214,255,.08);cursor:pointer;transition:.2s;}
  .dl:hover{background:rgba(17,120,170,.45);box-shadow:0 0 26px rgba(53,214,255,.55);color:#fff;}
  .dl:disabled{opacity:.6;cursor:default;}
  .dlnote{color:#8fb6c8;font-size:12.5px;margin-top:8px;text-align:center;display:none;}
  .after{width:100%;margin-top:16px;background:linear-gradient(180deg,rgba(6,20,36,.82),rgba(3,12,24,.9));border:1px solid rgba(70,200,255,.32);border-radius:12px;padding:16px;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 30px rgba(20,150,255,.12);}
  .after p{font-family:"Exo 2",Arial,sans-serif;color:#e6f7ff;font-size:15px;margin-bottom:12px;text-align:center;}
  .btn{font-family:"Orbitron",Arial,sans-serif;font-size:12px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;border-radius:8px;padding:14px 16px;transition:.2s;}
  .btn.call{background:linear-gradient(180deg,#1fb6ff,#0a8fd0);color:#fff;border:1.5px solid #35d6ff;box-shadow:0 0 16px rgba(53,214,255,.45);}
  .btn.text{background:rgba(4,30,52,.72);color:#d9f7ff;border:1.5px solid rgba(53,214,255,.6);box-shadow:0 0 12px rgba(53,214,255,.2);}
  .btn:hover{box-shadow:0 0 26px rgba(53,214,255,.6);color:#fff;}
  .wm{font-family:"Exo 2",Arial,sans-serif;}
  @media (max-width:480px){
    h1{font-size:27px;}
  }
</style>
</head>
<body>
<header>
  <div class="mark">VECTOR <span>VX</span></div>
</header>

<main>
  <div class="intro">
    <div class="eyebrow" id="eyebrow">A video for</div>
    <h1 id="clientName">You</h1>
    <div class="vtitle" id="videoTitle"></div>
  </div>

  <div class="frame">
    <video id="player" controls playsinline preload="metadata"></video>
    <div class="wm"><strong>Josh Hicks</strong><br>319-631-1461</div>
  </div>

  <button class="dl" id="dlBtn" type="button">Download video</button>
  <div class="dlnote" id="dlNote"></div>

  <div class="after">
    <p id="afterMsg">Questions after you watch? I'm one tap away.</p>
    <div class="actions">
      <a class="btn call" href="tel:3196311461">Call Josh</a>
      <a class="btn text" href="sms:3196311461">Text Josh</a>
    </div>
  </div>
</main>

<footer>
  Josh Hicks &middot; 319-631-1461
</footer>

<script>
/* ================= CONFIG =================
   Tracking posts to a Google Form. Until the
   real IDs are pasted below, tracking is off
   and the page still plays video normally.
============================================ */
var TRACK = {
  FORM_ID: "1FAIpQLScItwJBY276yEdNE2_V78aljuu2IN0NpPnU3yn2GBGFKx-T_w",
  ENTRY_CLIENT: "entry.263473050",
  ENTRY_VIDEO:  "entry.142457724",
  ENTRY_EVENT:  "entry.1106739103",
  ENTRY_PERCENT:"entry.1639667489"
};

function getParam(name){
  return new URLSearchParams(window.location.search).get(name) || "";
}

var client = getParam("c");
var title  = getParam("t");
var vsrc   = getParam("v");

if (client){
  document.getElementById("clientName").textContent = client;
  document.title = "A video for " + client + " — Josh Hicks";
} else {
  document.getElementById("eyebrow").textContent = "A video from Josh";
  document.getElementById("clientName").textContent = "Vector VX";
}
if (title){
  document.getElementById("videoTitle").textContent = title;
}

var player = document.getElementById("player");
if (vsrc){
  player.src = vsrc; // filename in this repo, or a full https:// URL
} else {
  document.querySelector(".frame").style.display = "none";
  document.getElementById("dlBtn").style.display = "none";
  document.getElementById("afterMsg").textContent =
    "This video link is missing its video. Call or text me and I'll resend it.";
}

/* ---------- download ---------- */
var dlBtn = document.getElementById("dlBtn");
var dlNote = document.getElementById("dlNote");
var dlName = (vsrc.split("/").pop() || "video.mp4").split("?")[0];

function dlMsg(t){ dlNote.textContent = t; dlNote.style.display = t ? "block" : "none"; }

function openFallback(){
  window.open(vsrc, "_blank");
  dlMsg("The video opened in a new tab. On iPhone tap Share \u2192 Save Video; on a computer right-click \u2192 Save Video As.");
}

dlBtn.addEventListener("click", function(){
  if (!vsrc) return;
  beacon("Downloaded", 100);
  if (!window.fetch || !window.ReadableStream){ openFallback(); return; }
  dlBtn.disabled = true;
  dlBtn.textContent = "Downloading\u2026";
  fetch(vsrc).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    var total = +r.headers.get("Content-Length") || 0;
    var reader = r.body.getReader(), got = 0, chunks = [];
    function pump(){
      return reader.read().then(function(res){
        if (res.done) return new Blob(chunks, {type:"video/mp4"});
        chunks.push(res.value); got += res.value.length;
        if (total) dlBtn.textContent = "Downloading\u2026 " + Math.round(got / total * 100) + "%";
        return pump();
      });
    }
    return pump();
  }).then(function(blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = dlName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    dlBtn.textContent = "Saved";
    dlMsg("Saved to your Downloads folder.");
    setTimeout(function(){ dlBtn.disabled = false; dlBtn.textContent = "Download video"; }, 4000);
  }).catch(function(){
    dlBtn.disabled = false;
    dlBtn.textContent = "Download video";
    openFallback();
  });
});

/* ---------- tracking ---------- */
var trackingOn = TRACK.FORM_ID.indexOf("PASTE_") === -1;
var sent = {};
var videoLabel = title || ((vsrc.split("/").pop() || "unknown").split("?")[0]);

function beacon(eventName, percent){
  if (!trackingOn || sent[eventName]) return;
  sent[eventName] = true;
  var url = "https://docs.google.com/forms/d/e/" + TRACK.FORM_ID + "/formResponse";
  var data = new FormData();
  data.append(TRACK.ENTRY_CLIENT,  client || "unknown");
  data.append(TRACK.ENTRY_VIDEO,   videoLabel);
  data.append(TRACK.ENTRY_EVENT,   eventName);
  data.append(TRACK.ENTRY_PERCENT, String(percent));
  if (navigator.sendBeacon){
    navigator.sendBeacon(url, data);
  } else {
    fetch(url, {method:"POST", mode:"no-cors", body:data, keepalive:true});
  }
}

beacon("Opened", 0);

player.addEventListener("play", function(){ beacon("Started", 1); });

player.addEventListener("timeupdate", function(){
  if (!player.duration) return;
  var pct = (player.currentTime / player.duration) * 100;
  if (pct >= 95){ beacon("Completed", 100); }
  else if (pct >= 75){ beacon("Watched 75%", 75); }
  else if (pct >= 50){ beacon("Watched 50%", 50); }
  else if (pct >= 25){ beacon("Watched 25%", 25); }
});

player.addEventListener("ended", function(){ beacon("Completed", 100); });
</script>
</body>
</html>
